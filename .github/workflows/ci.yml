name: API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  database:
    name: Rebuild database from zero
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:start
      - run: bun run db:reset
      - run: bunx supabase migration list --local
      - name: Stop the local database
        if: always()
        run: bun run db:stop

  container:
    name: Build and smoke-test container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build immutable image
        run: docker build --tag hbs-home-api:${GITHUB_SHA} .
      - name: Run container
        run: >-
          docker run --detach --name hbs-home-api-ci --publish 3000:10000
          --env NODE_ENV=production --env LOG_LEVEL=info
          hbs-home-api:${GITHUB_SHA}
      - name: Verify container health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs hbs-home-api-ci
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm --force hbs-home-api-ci || true
