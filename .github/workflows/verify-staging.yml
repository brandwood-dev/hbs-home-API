name: Verify API staging

on:
  workflow_run:
    workflows: [API CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-staging
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://api-preview.hbs-home.com/health/ready
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Wait for the exact Render release
        env:
          SMOKE_BASE_URL: https://api-preview.hbs-home.com
          EXPECTED_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in {1..40}; do
            if bun run smoke; then
              exit 0
            fi
            sleep 15
          done
          exit 1
