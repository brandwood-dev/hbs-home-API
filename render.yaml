services:
  - type: web
    name: hbs-home-api-staging
    runtime: docker
    repo: https://github.com/brandwood-dev/hbs-home-API
    branch: main
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The post-deploy smoke workflow waits for this service. Gating Render on
    # every GitHub check would make that workflow circular: it cannot pass
    # until Render deploys, while Render would wait for it to pass.
    autoDeployTrigger: commit
    healthCheckPath: /health/ready
    domains:
      - api-preview.hbs-home.com
    envVars:
      - key: NODE_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://preview.hbs-home.com
      - key: DOCS_ENABLED
        value: true
      - key: API_PUBLIC_URL
        value: https://api-preview.hbs-home.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: 5
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: catalog-media
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: ORDER_EMAIL_NOTIFICATIONS_ENABLED
        value: false
      - key: ORDER_EMAIL_ROLLOUT_AT
        sync: false
      - key: SMTP_HOST
        value: ssl0.ovh.net
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: contact@hbs-home.com
      - key: ADMIN_APP_URL
        value: https://preview.hbs-home.com
      - key: ORDER_EMAIL_POLL_INTERVAL_SECONDS
        value: 15
      - key: ORDER_EMAIL_MAX_ATTEMPTS
        value: 5
      - key: ORDER_EMAIL_BATCH_SIZE
        value: 10
      - key: RELEASE_VERSION
        value: 0.5.0-staging
