services:
  - type: web
    name: hbs-home-api-staging
    runtime: docker
    repo: https://github.com/brandwood-dev/hbs-home-API
    branch: main
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    domains:
      - api-preview.hbs-home.com
    envVars:
      - key: NODE_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://preview.hbs-home.com
      - key: DOCS_ENABLED
        value: true
      - key: API_PUBLIC_URL
        value: https://api-preview.hbs-home.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: 5
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: RELEASE_VERSION
        value: 0.2.0-staging
